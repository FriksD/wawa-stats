<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>WAWA userscript test harness</title>
<script>
  // 模拟 Tampermonkey GM_* API
  const store = {};
  window.__gmStore = store;
  function GM_getValue(key, def) { return key in store ? store[key] : def; }
  function GM_setValue(key, val) { store[key] = JSON.parse(JSON.stringify(val)); }
  function GM_addStyle(css) {
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
  }
  function GM_registerMenuCommand() {}
  window.__runtimeErrors = [];
  window.addEventListener('error', function (e) {
    window.__runtimeErrors.push(String(e.message) + ' @ ' + e.filename + ':' + e.lineno);
  });
</script>
</head>
<body>
<script src="wawa-stats.user.js"></script>
<script>
(function () {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function finish(result) {
    const json = 'RESULT:' + JSON.stringify(result);
    document.title = json;
    document.body.setAttribute('data-result', JSON.stringify(result));
    console.log(json);
  }

  // ===== 模拟站点接口 =====
  // 收益接口返回全部 3 本书（书C 只存在于接口，不渲染在当前页，模拟“第二页的书”）
  const revenueData = [
    { base_novel_id: 9001, title: '测试书A', total_revenue: 100, latest: { date: '2026-08-29', revenue: 10.5, follow_user_cnt: 500, available: true }, previous: { date: '2026-08-28', revenue: 9.5, follow_user_cnt: 490, available: true } },
    { base_novel_id: 9002, title: '测试书B', total_revenue: 200, latest: { date: '2026-08-29', revenue: 20, follow_user_cnt: 300, available: true }, previous: { date: '2026-08-28', revenue: 18, follow_user_cnt: 300, available: true } },
    { base_novel_id: 9003, title: '测试书C翻页书', total_revenue: 300, latest: { date: '2026-08-29', revenue: 30, follow_user_cnt: 100, available: true }, previous: { date: '2026-08-28', revenue: 25, follow_user_cnt: 120, available: true } },
  ];
  // 列表接口分两页：第 1 页 A/B，第 2 页只有 C
  const listPages = {
    1: [
      { submission_id: 111, base_novel_id: 9001, title: '测试书A', status: 'contracted', total_word_count: 608236, submitted_chapter_ids: new Array(200).fill('c') },
      { submission_id: 112, base_novel_id: 9002, title: '测试书B', status: 'contracting', total_word_count: 1342463, submitted_chapter_ids: new Array(450).fill('c') },
    ],
    2: [
      { submission_id: 113, base_novel_id: 9003, title: '测试书C翻页书', status: 'reviewing', total_word_count: 1234567, submitted_chapter_ids: new Array(37).fill('c') },
    ],
  };
  const myListCalls = [];
  window.fetch = async function (url, opts) {
    url = String(url);
    const body = opts && opts.body ? JSON.parse(opts.body) : {};
    if (url.indexOf('my_revenue') >= 0) {
      return new Response(JSON.stringify({ code: 200, message: 'success', data: revenueData }), { headers: { 'content-type': 'application/json' } });
    }
    if (url.indexOf('my_list') >= 0) {
      myListCalls.push(body);
      const page = body.page || 1;
      return new Response(JSON.stringify({
        code: 200,
        message: 'success',
        data: { page, page_size: body.page_size || 20, total: 3, total_page: 2, offset: (page - 1) * 20, items: listPages[page] || [] },
      }), { headers: { 'content-type': 'application/json' } });
    }
    return new Response(JSON.stringify({ code: 404, message: 'unexpected: ' + url }));
  };

  // ===== 模拟当前页面 DOM：只渲染第 1 页的两张卡片 =====
  function cardHtml(id, title, chapters, words, status) {
    return '<div class="submission-item" data-submission-id="' + id + '">' +
      '<h3>' + title + '</h3>' +
      '<div class="submission-item-stats">' +
      '<div>章节：' + chapters + '</div>' +
      '<div>总字数：' + words + '</div>' +
      '<div>状态：' + status + '</div>' +
      '</div></div>';
  }
  const wrap = document.createElement('div');
  wrap.innerHTML = cardHtml('111', '测试书A', '200章', '60.82万字', '已签约') + cardHtml('112', '测试书B', '450章', '134.25万字', '签约中');
  document.body.appendChild(wrap);

  const rowTitles = () => Array.from(document.querySelectorAll('#wawaAllBooks tbody tr .wawa-book-title'))
    .map((e) => e.textContent.replace(/已忽略\s*$/, '').trim());

  async function run() {
    const result = { fab: false, statsBtn: false, captureBtn: false, statsRoot: false, runtimeErrors: [], bodyHasChildren: 0 };
    await sleep(300);
    result.fab = !!document.getElementById('wawaFab');
    result.statsBtn = !!document.getElementById('wawaStatsBtn');
    result.captureBtn = !!document.getElementById('wawaCaptureBtn');
    result.statsRoot = !!document.getElementById('wawaStatsRoot');

    // 1. 手动采集：DOM 只有 A/B，接口补全 C
    document.getElementById('wawaCaptureBtn').click();
    await sleep(600);

    const saved = window.__gmStore['wawaStats_v1'] || {};
    const recs = saved.records || [];
    result.listApiCalls = myListCalls.length;                 // 期望 2（两页）
    result.recordCount = recs.length;                         // 期望 1（同一天一条记录）
    result.bookCount = (recs[0] && recs[0].books || []).length; // 期望 3
    const byTitle = {};
    ((recs[0] && recs[0].books) || []).forEach((b) => { byTitle[b.title] = b; });
    const bookA = byTitle['测试书A'] || {};
    const bookC = byTitle['测试书C翻页书'] || {};
    // 第 1 页书：字段来自 DOM，应保持原样
    result.page1Book = { wordsText: bookA.wordsText, status: bookA.status, chapterText: bookA.chapterText };
    // 第 2 页书：字数/状态/章节应从列表接口补全；收益/在读来自收益接口
    result.page2Book = { wordsText: bookC.wordsText, status: bookC.status, chapterText: bookC.chapterText, submissionId: bookC.submissionId, readers: bookC.readers, totalRevenue: bookC.totalRevenue };
    // 期望值：1234567 → 123.46万字；reviewing → 投稿审核中；37 章
    result.expectPage2 = { wordsText: '123.46万字', status: '投稿审核中', chapterText: '37章', submissionId: '113', readers: 100, totalRevenue: 300 };

    // 2. 打开统计面板：未忽略时按总收益排序 C(300) > B(200) > A(100)
    document.getElementById('wawaStatsBtn').click();
    await sleep(100);
    result.orderBefore = rowTitles();

    // 3. 忽略 C：切到单书详情 → 选中 C → 点忽略按钮
    document.querySelector('#wawaStatsRoot .wawa-tab[data-view="book"]').click();
    await sleep(100);
    const sel = document.getElementById('wawaBookSelect');
    sel.value = '测试书C翻页书';
    sel.dispatchEvent(new Event('change'));
    await sleep(100);
    const ignoreBtn = document.getElementById('wawaIgnoreBtn');
    result.ignoreBtnTextBefore = ignoreBtn && ignoreBtn.textContent;
    ignoreBtn.click();
    await sleep(100);
    result.ignoredList = (window.__gmStore['wawaStats_v1'].ignoredBooks || []).slice();
    result.ignoreBtnTextAfter = ignoreBtn.textContent;

    // 4. 回全局概览：C 应排到最后，行内带“已忽略”标记
    document.querySelector('#wawaStatsRoot .wawa-tab[data-view="global"]').click();
    await sleep(100);
    result.orderAfterIgnore = rowTitles();
    result.ignoredBadgeShown = !!document.querySelector('#wawaAllBooks .wawa-badge-ignored');

    // 5. 取消忽略：恢复按总收益排序
    document.querySelector('#wawaStatsRoot .wawa-tab[data-view="book"]').click();
    await sleep(100);
    document.getElementById('wawaIgnoreBtn').click();
    await sleep(100);
    document.querySelector('#wawaStatsRoot .wawa-tab[data-view="global"]').click();
    await sleep(100);
    result.orderAfterUnignore = rowTitles();

    // 6. 全部书籍总览不应再有内滚动高度限制
    result.allBooksMaxHeight = getComputedStyle(document.getElementById('wawaAllBooks')).maxHeight;

    result.runtimeErrors = window.__runtimeErrors || [];
    result.bodyHasChildren = document.body.children.length;
    finish(result);
  }

  run().catch((e) => finish({ fatal: String((e && e.stack) || e) }));
})();
</script>
</body>
</html>
